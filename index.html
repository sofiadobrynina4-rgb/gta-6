<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Theft Auto VI - Official PC Digital Download</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0b0b0e url("https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcTPv7O5ACprNFjR4Ww93QrigMh3jeShlYAGTV76e9QOPl99kmR9") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        /* Dark glow overlay to enhance contrast and cool vibe */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(20, 10, 30, 0.45) 0%, rgba(5, 5, 10, 0.85) 100%);
            z-index: 1;
        }

        .card {
            position: relative;
            z-index: 2;
            background: rgba(14, 14, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 0, 128, 0.15);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 0, 128, 0.2);
            color: #ff3399;
            border: 1px solid rgba(255, 0, 128, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(255, 0, 128, 0.2);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #a1a1aa;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .specs {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 30px;
            font-size: 0.85rem;
            color: #d4d4d8;
        }

        .download-btn {
            width: 100%;
            background: linear-gradient(90deg, #ff007a 0%, #7928ca 100%);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(255, 0, 122, 0.4);
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 0, 122, 0.6);
        }

        /* Loading Screen */
        #loading-state {
            display: none;
        }

        .status-text {
            font-size: 0.9rem;
            color: #a1a1aa;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff007a, #7928ca);
            transition: width 0.1s linear;
            box-shadow: 0 0 12px rgba(255, 0, 122, 0.8);
        }

        .sub-status {
            font-size: 0.8rem;
            color: #71717a;
        }

        /* Reveal Screen */
        .prank-reveal {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .prank-reveal h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
        }

        .prank-reveal p {
            color: #a1a1aa;
            font-size: 1.1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="landing-state">
            <span class="badge">Official Digital Edition</span>
            <h1>Grand Theft Auto VI</h1>
            <p class="subtitle">Direct PC Installer • Build 1.0.44 • Full Game</p>
            
            <div class="specs">
                <div><span>Size:</span> <strong>112 GB</strong></div>
                <div><span>Platform:</span> <strong>Windows PC</strong></div>
                <div><span>Ver:</span> <strong>v1.0</strong></div>
            </div>

            <button class="download-btn" onclick="startLoading()">Download Installer (112 GB)</button>
        </div>

        <div id="loading-state">
            <div class="status-text">
                <span id="status-label">Allocating disk space...</span>
                <span id="percent-label">0%</span>
            </div>
            <div class="progress-bar-container">
                <div id="progress" class="progress-bar-fill"></div>
            </div>
            <div id="sub-status" class="sub-status">Connecting to secure CDN edge server...</div>
        </div>

        <div id="prank-state" class="prank-reveal">
            <h2>💀 BRO THOUGHT HE WAS GETTING GTA 6 😭</h2>
            <p>Nice try, better luck next time!</p>
        </div>
    </div>

    <script>
        function startLoading() {
            document.getElementById('landing-state').style.display = 'none';
            document.getElementById('loading-state').style.display = 'block';

            let percent = 0;
            const percentLabel = document.getElementById('percent-label');
            const statusLabel = document.getElementById('status-label');
            const subStatus = document.getElementById('sub-status');
            const progressBar = document.getElementById('progress');

            const percentInterval = setInterval(() => {
                percent++;
                
                if (percent <= 100) {
                    percentLabel.innerText = percent + '%';
                    progressBar.style.width = percent + '%';
                }

                if (percent === 25) {
                    statusLabel.innerText = "Downloading game assets...";
                    subStatus.innerText = "Downloading chunk_01.bin (28 GB)...";
                } else if (percent === 60) {
                    statusLabel.innerText = "Unpacking archives...";
                    subStatus.innerText = "Extracting textures_high.rpf...";
                } else if (percent === 85) {
                    statusLabel.innerText = "Verifying license integrity...";
                    subStatus.innerText = "Finalizing installation...";
                }

                if (percent >= 100) {
                    clearInterval(percentInterval);
                    setTimeout(() => {
                        document.getElementById('loading-state').style.display = 'none';
                        document.getElementById('prank-state').style.display = 'block';
                    }, 500);
                }
            }, 100);
        }
    </script>

</body>
</html>
